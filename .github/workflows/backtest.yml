name: Backtest Instructions

on:
  pull_request:
    paths:
      - "tests/backtests/**"
      - ".github/workflows/backtest.yml"
      - "src/**"
      - "pyproject.toml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync

      - name: Run baseline (main branch)
        run: |
          uv run ai-backtest run \
            --tests tests/backtests/ \
            --output /tmp/baseline_results.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run candidate (current branch)
        run: |
          uv run ai-backtest run \
            --tests tests/backtests/ \
            --output /tmp/candidate_results.md \
            --html /tmp/candidate_results.html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate comparison
        run: |
          uv run ai-backtest compare \
            --baseline /tmp/baseline_results.md \
            --candidate /tmp/candidate_results.md \
            --output /tmp/comparison.md || true
        continue-on-error: true

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const candidateResults = fs.readFileSync('/tmp/candidate_results.md', 'utf8');
            const comparisonResults = fs.existsSync('/tmp/comparison.md')
              ? fs.readFileSync('/tmp/comparison.md', 'utf8')
              : 'Comparison not available';

            const comment = `## 🧪 Backtest Results

### Candidate Branch Results
${candidateResults.substring(0, 3000)}

### Comparison vs Main
${comparisonResults.substring(0, 3000)}

**Full reports available in workflow artifacts.**
`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backtest-results
          path: |
            /tmp/candidate_results.html
            /tmp/candidate_results.md
            /tmp/comparison.md
          retention-days: 7

      - name: Check for regressions
        if: failure()
        run: |
          echo "❌ Backtests failed - check PR comment for details"
          exit 1
